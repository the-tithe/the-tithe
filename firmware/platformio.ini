; The Tithe: firmware for the Cardputer ADV (the device in the game is the Deck).
;   pio run -e cardputer -t upload    build and flash (Cardputer on USB)
;   pio test -e native                logic tests on this computer
;   pio run -e render && .pio/build/render/program
;                                     draw every screen to PNG files in shots/

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps =
  m5stack/M5Cardputer@1.1.1
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
lib_deps = m5stack/M5GFX@0.2.35
build_flags = -std=gnu++17 -Isrc -Wall -DUNITY_INCLUDE_DOUBLE -I/opt/homebrew/include -L/opt/homebrew/lib -lSDL2
test_ignore = test_depth

[env:render]
platform = native
lib_deps = m5stack/M5GFX@0.2.35
build_src_filter = +<*> -<main.cpp> +<../render/>
build_flags = -std=gnu++17 -Isrc -I/opt/homebrew/include -L/opt/homebrew/lib -lSDL2

; The habit-switch bot (test/test_depth) plays thousands of weeks per rule and
; takes minutes, so it stays out of the plain test run:
;   pio test -e depth --without-testing && .pio/build/depth/program [scenario]
[env:depth]
extends = env:native
test_filter = test_depth
test_ignore =
build_flags = ${env:native.build_flags} -O2
